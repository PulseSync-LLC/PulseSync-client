[package]
name = "pulsesync-bootstrapper"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "pulsesync-bootstrapper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
