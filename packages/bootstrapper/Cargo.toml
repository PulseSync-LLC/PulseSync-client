[package]
name = "pulsesync-bootstrapper"
version = "0.3.45"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "pulsesync-bootstrapper"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
hex = "0.4.3"
libc = "0.2.191"
node-semver = "2.2.0"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["rustls"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
