<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Запуск PulseSync</title>
    </head>

    <body>
        <main id="bootstrap-root" class="bootstrap" data-phase="checking" aria-live="polite">
            <div class="brand" aria-hidden="true">
                <svg class="brand__logo" width="112" height="112" viewBox="0 0 82 82" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="42.3003" y="58.5426" width="39.6997" height="23.4286" rx="6" fill="currentColor" />
                    <path
                        d="M0 6C0 2.68629 2.68629 0 6 0H76C79.3137 0 82 2.68629 82 6V46.7143C82 50.028 79.3137 52.7143 76 52.7143H42.4444C39.1307 52.7143 36.4444 55.4006 36.4444 58.7143V76C36.4444 79.3137 33.7582 82 30.4444 82H6C2.68629 82 0 79.3137 0 76V35.2857C0 31.972 2.68629 29.2857 6 29.2857H42.627C44.2444 29.2857 45.5556 27.9745 45.5556 26.3571C45.5556 24.7397 44.2444 23.4286 42.627 23.4286H6C2.68629 23.4286 0 20.7423 0 17.4286V6Z"
                        fill="currentColor"
                    />
                </svg>
            </div>

            <section class="status" aria-labelledby="bootstrap-status">
                <p id="bootstrap-status">Проверяем обновления…</p>
            </section>

            <section class="progress" aria-label="Ход запуска">
                <progress id="bootstrap-progress" max="1"></progress>
                <span id="bootstrap-progress-text" class="progress__text">Подождите немного</span>
            </section>

        </main>

        <script type="module" src="/src/main/preload.ts"></script>
    </body>
</html>
