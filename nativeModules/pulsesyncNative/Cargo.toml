[package]
name = "pulsesync-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = "1.1.9"
memmap2 = "0.9.10"
napi = { version = "3.9.1", default-features = false, features = ["napi10"] }
napi-derive = "3.5.6"
plist = "1.9.0"
serde_json = "1.0.150"
sha2 = "0.11.0"
zstd = "0.13.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry"] }

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
