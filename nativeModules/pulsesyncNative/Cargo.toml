[package]
name = "pulsesync-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = "1.1.10"
memmap2 = "0.9.11"
napi = { version = "3.14.2", default-features = false, features = ["napi10"] }
napi-derive = "3.6.12"
plist = "1.10.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
zstd = "0.14.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry"] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
