name: Cache desktop build dependencies
description: Cache Cargo downloads, native module outputs, and bootstrapper outputs independently.

runs:
  using: composite
  steps:
    - name: Cache Cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-rust188-${{ hashFiles('nativeModules/**/Cargo.lock', 'packages/bootstrapper/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-${{ runner.arch }}-rust188-

    - name: Cache native module builds
      uses: actions/cache@v5
      with:
        path: |
          nativeModules/**/node_modules
          nativeModules/**/build
          nativeModules/**/target
        key: native-build-${{ runner.os }}-${{ runner.arch }}-node22-rust188-${{ hashFiles('nativeModules/**/package.json', 'nativeModules/**/Cargo.toml', 'nativeModules/**/Cargo.lock', 'nativeModules/**/build.rs', 'nativeModules/**/scripts/**', 'nativeModules/**/*.rs') }}-input-stamps-v2
        restore-keys: |
          native-build-${{ runner.os }}-${{ runner.arch }}-node22-rust188-

    - name: Cache bootstrapper build
      uses: actions/cache@v5
      with:
        path: packages/bootstrapper/target
        key: bootstrapper-build-${{ runner.os }}-${{ runner.arch }}-rust188-${{ hashFiles('packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/build.rs', 'packages/bootstrapper/src/**/*.rs', 'scripts/bootstrapper/build.ts') }}-input-stamps-v2
        restore-keys: |
          bootstrapper-build-${{ runner.os }}-${{ runner.arch }}-rust188-
