name: Build Application (Release)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  tests:
    name: Test Desktop
    uses: ./.github/workflows/desktop-tests.yml

  build:
    needs: tests
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-26]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build (package)
        run: yarn build:package --nativeModules
        env:
          BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PUBLISH_BRANCH_FROM_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Upload release artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

      - name: Publish changelog (single-run on ubuntu)
        if: ${{ matrix.os == 'blacksmith-4vcpu-ubuntu-2204' && !contains(github.ref_name, 'dev') }}
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            VERSION_ARGS=(--version "${{ github.ref_name }}")
          fi

          yarn publish:api "${VERSION_ARGS[@]}"
          yarn publish:discord "${VERSION_ARGS[@]}"

  github_release:
    name: Create GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: github-release-artifacts

      - name: Prepare GitHub Release assets
        run: >-
          yarn tsx scripts/github-release-runtime.ts prepare
          --source github-release-artifacts
          --target github-release-assets
          --repository ${{ github.repository }}
          --tag ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  publish_aur:
    name: Publish AUR Package
    needs: [build, github_release]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit
