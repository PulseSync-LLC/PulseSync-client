name: Build Application (Release)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: yarn tsx scripts/release-tag.ts "$RELEASE_TAG"

  tests:
    name: Test Desktop
    uses: ./.github/workflows/desktop-tests.yml
    with:
      use_blacksmith: true

  build:
    needs: [tag, tests]
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build (package)
        run: yarn build:package --nativeModules
        env:
          PULSESYNC_WINDOWS_PFX_BASE64: ${{ secrets.PULSESYNC_WINDOWS_PFX_BASE64 }}
          PULSESYNC_WINDOWS_PFX_PASSWORD: ${{ secrets.PULSESYNC_WINDOWS_PFX_PASSWORD }}
          BUILD_VERSION: ${{ needs.tag.outputs.version }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PUBLISH_BRANCH_FROM_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          PULSESYNC_DEFER_S3_PUBLISH: "1"
          PULSESYNC_AUTO_COMPONENT_REVISIONS: "1"
          PULSESYNC_DISABLE_FILE_INVENTORIES: "0"
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Upload release artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

  publish_renderer:
    name: Publish Release Renderer
    needs: [tag, prepare_release]
    uses: ./.github/workflows/publish-renderer.yml
    with:
      channel: ${{ needs.tag.outputs.channel }}
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  prepare_release:
    name: Prepare Complete Release
    needs: [tag, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: github-release-artifacts
          merge-multiple: true

      - name: Validate complete staged release
        env:
          EXPECTED_VERSION: ${{ needs.tag.outputs.version }}
          EXPECTED_CHANNEL: ${{ needs.tag.outputs.channel }}
          EXPECTED_METADATA_VERSION: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const expected = [
            ['desktop-update-hybrid-darwin-universal.json', 'darwin-universal'],
            ['desktop-update-linux-x64.json', 'linux-x64'],
            ['desktop-update-win32-x64.json', 'win32-x64'],
          ]
          for (const [name, dist] of expected) {
            const file = path.join('github-release-artifacts', name)
            if (!fs.existsSync(file)) throw new Error(`Missing staged manifest: ${name}`)
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
            if (String(manifest.metadataVersion) !== process.env.EXPECTED_METADATA_VERSION ||
                manifest.desktopVersion !== process.env.EXPECTED_VERSION ||
                manifest.channel !== process.env.EXPECTED_CHANNEL || !manifest.targets?.[dist]) {
              throw new Error(`Staged manifest does not match this release: ${name}`)
            }
          }
          NODE

      - name: Prepare GitHub Release assets
        run: >-
          yarn tsx scripts/github-release-runtime.ts prepare
          --source github-release-artifacts
          --target github-release-assets
          --repository ${{ github.repository }}
          --tag ${{ github.ref_name }}

      - name: Stage validated S3 release
        uses: actions/upload-artifact@v7
        with:
          name: validated-tagged-release
          path: github-release-artifacts/**/*
          if-no-files-found: error

      - name: Stage prepared GitHub assets
        uses: actions/upload-artifact@v7
        with:
          name: prepared-tagged-github-release
          path: github-release-assets/*
          if-no-files-found: error

  github_release:
    name: Publish Complete Release
    needs: [tag, prepare_release, publish_renderer]
    concurrency:
      group: desktop-manifest-publish-${{ needs.tag.outputs.channel }}
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Download validated S3 release
        uses: actions/download-artifact@v8
        with:
          name: validated-tagged-release
          path: github-release-artifacts

      - name: Download prepared GitHub assets
        uses: actions/download-artifact@v8
        with:
          name: prepared-tagged-github-release
          path: github-release-assets

      - name: Publish complete S3 release
        run: >-
          yarn tsx scripts/s3-upload.ts
          --branch ${{ needs.tag.outputs.channel }}
          --dir github-release-artifacts
          --version ${{ needs.tag.outputs.version }}
          --legacy-update-bridge
          --require-baseline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(needs.tag.outputs.version, '-') }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  publish_aur:
    name: Publish AUR Package
    needs: [build, github_release]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit

  cleanup_desktop_s3:
    name: Cleanup Desktop S3
    needs: [tag, github_release, publish_aur]
    if: >-
      ${{
        !cancelled() &&
        needs.github_release.result == 'success' &&
        needs.publish_aur.result == 'success' &&
        (needs.tag.outputs.channel == 'dev' || needs.tag.outputs.channel == 'beta')
      }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/desktop-s3-cleanup.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit
