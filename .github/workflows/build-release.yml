name: Build Application (Release)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  tests:
    name: Test Desktop
    uses: ./.github/workflows/desktop-tests.yml

  build:
    needs: tests
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26, macos-26-intel]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - uses: actions/cache@v5
        with:
          path: |
            nativeModules/**/node_modules
            nativeModules/**/build
            nativeModules/**/target
            packages/bootstrapper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-node22-rust188-${{ hashFiles('nativeModules/**/package.json', 'nativeModules/**/Cargo.toml', 'nativeModules/**/Cargo.lock', 'nativeModules/**/build.rs', 'nativeModules/**/*.rs', 'packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/src/**/*.rs') }}

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build (package)
        run: yarn build:package --nativeModules ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }}
        env:
          BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PULSESYNC_MAC_SIGN_IDENTITY: "-"
          PUBLISH_BRANCH_FROM_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          PULSESYNC_BUNDLE_RENDERER: "1"
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }}

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Upload release artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

      - name: Publish changelog (single-run on ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && !contains(github.ref_name, 'dev') }}
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            VERSION_ARGS=(--version "${{ github.ref_name }}")
          fi

          yarn publish:api "${VERSION_ARGS[@]}"
          yarn publish:discord "${VERSION_ARGS[@]}"

  github_release:
    name: Create GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: github-release-artifacts

      - name: Prepare GitHub Release assets
        shell: bash
        run: |
          mkdir -p github-release-assets
          declare -A NAME_COUNT=()

          while IFS= read -r -d '' file; do
            base_name="$(basename "$file")"
            artifact_dir="$(printf '%s' "$file" | sed -E 's#^github-release-artifacts/([^/]+)/.*#\1#')"
            target_name="$base_name"
            name_count="${NAME_COUNT[$base_name]:-0}"

            if (( name_count > 0 )); then
              target_name="${artifact_dir}-${name_count}-${base_name}"
            fi

            NAME_COUNT["$base_name"]=$((name_count + 1))
            cp "$file" "github-release-assets/$target_name"
          done < <(find github-release-artifacts -type f -print0 | sort -z)

          find github-release-assets -maxdepth 1 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  publish_aur:
    name: Publish AUR Package
    needs: [build, github_release]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit
