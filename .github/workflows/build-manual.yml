name: Build Application (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose build branch"
        required: true
        default: "dev"
      build_os:
        description: "Choose OS to build"
        required: true
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-26
          - windows+macos
        default: all
      upload_to_s3:
        description: "Upload release/ to S3 after build"
        required: true
        type: boolean
        default: true
      s3_branch:
        description: "Subpath under prefix (e.g. 'tests', 'beta', 'alpha', 'dev')"
        required: true
        default: "tests"
      publish_renderer:
        description: "Publish the remote renderer globally"
        required: true
        type: boolean
        default: false
      publish_changelog:
        description: "Publish changelog (API/Discord)"
        required: true
        type: boolean
        default: false
      changelog_target:
        description: "Where to publish changelog"
        required: true
        type: choice
        options:
          - both
          - api
          - discord
        default: both
      changelog_version:
        description: "Override version for changelog (optional)"
        required: false
        default: ""

concurrency:
  group: build-manual-${{ github.workflow }}-${{ inputs.target }}-${{ inputs.build_os }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: ${{ fromJson(inputs.build_os == 'all' && '["ubuntu-latest","windows-latest","macos-26","macos-26-intel"]' || (inputs.build_os == 'macos-26' && '["macos-26","macos-26-intel"]' || (inputs.build_os == 'windows+macos' && '["windows-latest","macos-26","macos-26-intel"]' || format('["{0}"]', inputs.build_os)))) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - uses: actions/cache@v5
        with:
          path: |
            nativeModules/**/node_modules
            nativeModules/**/build
            nativeModules/**/target
            packages/bootstrapper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-node22-rust188-${{ hashFiles('nativeModules/**/package.json', 'nativeModules/**/Cargo.toml', 'nativeModules/**/Cargo.lock', 'nativeModules/**/build.rs', 'nativeModules/**/*.rs', 'packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/src/**/*.rs') }}

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build (package)
        run: yarn build:package --nativeModules ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }} ${{ inputs.upload_to_s3 && format('--publish {0}', inputs.s3_branch) || '' }}
        env:
          PULSESYNC_MAC_SIGN_IDENTITY: "-"

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }}

      - name: Verify macOS atomic bundle update
        if: startsWith(matrix.os, 'macos-')
        run: yarn bootstrapper:verify-macos-update

      - name: Verify macOS external recovery across helper crashes
        if: startsWith(matrix.os, 'macos-') && runner.arch == 'ARM64'
        run: |
          yarn bootstrapper:verify-macos-update --with-launch-agent --kill-helper-after-exchange
          yarn bootstrapper:verify-macos-update --with-launch-agent --kill-helper-after-ack

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Publish changelog (optional, single-run on ubuntu)
        if: ${{ inputs.publish_changelog == true && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          VERSION_ARGS=()
          if [ -n "${{ inputs.changelog_version }}" ]; then
            VERSION_ARGS=(--version "${{ inputs.changelog_version }}")
          fi

          case "${{ inputs.changelog_target }}" in
            both)
              yarn publish:api "${VERSION_ARGS[@]}"
              yarn publish:discord "${VERSION_ARGS[@]}"
              ;;
            api)
              yarn publish:api "${VERSION_ARGS[@]}"
              ;;
            discord)
              yarn publish:discord "${VERSION_ARGS[@]}"
              ;;
            *)
              echo "Unknown changelog_target"; exit 1
              ;;
          esac

  publish_renderer:
    name: Publish Remote Renderer
    needs: build
    if: ${{ inputs.publish_renderer == true }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Publish remote renderer
        run: yarn renderer:publish
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}
