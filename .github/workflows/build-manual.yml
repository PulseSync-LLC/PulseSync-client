name: Build Application (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose build branch"
        required: true
        default: "dev"
      build_os:
        description: "Choose OS to build"
        required: true
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-26
          - windows+macos
        default: all
      upload_to_s3:
        description: "Upload release/ to S3 after build"
        required: true
        type: boolean
        default: true
      upload_to_glitchtip:
        description: "Upload source maps to GlitchTip"
        required: true
        type: boolean
        default: false
      s3_branch:
        description: "Subpath under prefix (e.g. 'tests', 'beta', 'alpha', 'dev')"
        required: true
        default: "tests"
      publish_renderer:
        description: "Publish the remote renderer globally"
        required: true
        type: boolean
        default: false
      publish_changelog:
        description: "Publish changelog (API/Discord)"
        required: true
        type: boolean
        default: false
      changelog_target:
        description: "Where to publish changelog"
        required: true
        type: choice
        options:
          - both
          - api
          - discord
        default: both
      changelog_version:
        description: "Override version for changelog (optional)"
        required: false
        default: ""

concurrency:
  group: build-manual-${{ github.workflow }}-${{ inputs.target }}-${{ inputs.build_os }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Test Desktop
    uses: ./.github/workflows/desktop-tests.yml
    with:
      checkout_ref: ${{ inputs.target }}
      build_os: ${{ inputs.build_os }}

  build:
    needs: tests
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: ${{ fromJson(inputs.build_os == 'all' && '["ubuntu-latest","windows-latest","macos-26"]' || (inputs.build_os == 'windows+macos' && '["windows-latest","macos-26"]' || format('["{0}"]', inputs.build_os))) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: actions/cache@v5
        with:
          path: |
            nativeModules/**/node_modules
            nativeModules/**/build
            nativeModules/**/target
            packages/bootstrapper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-node22-rust188-${{ hashFiles('nativeModules/**/package.json', 'nativeModules/**/Cargo.toml', 'nativeModules/**/Cargo.lock', 'nativeModules/**/build.rs', 'nativeModules/**/*.rs', 'packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/src/**/*.rs') }}

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        if: ${{ inputs.upload_to_glitchtip == true }}
        run: yarn -s sentry-cli --version

      - name: Build (package)
        run: yarn build:package --nativeModules ${{ inputs.upload_to_s3 && format('--publish {0}', inputs.s3_branch) || '' }}
        env:
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PULSESYNC_MAC_SIGN_IDENTITY: "-"
          GLITCHTIP_SOURCEMAPS: ${{ inputs.upload_to_glitchtip && '1' || '0' }}
          GLITCHTIP_SOURCEMAPS_UPLOAD: ${{ inputs.upload_to_glitchtip && '1' || '0' }}
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Publish changelog (optional, single-run on ubuntu)
        if: ${{ inputs.publish_changelog == true && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          VERSION_ARGS=()
          if [ -n "${{ inputs.changelog_version }}" ]; then
            VERSION_ARGS=(--version "${{ inputs.changelog_version }}")
          fi

          case "${{ inputs.changelog_target }}" in
            both)
              yarn publish:api "${VERSION_ARGS[@]}"
              yarn publish:discord "${VERSION_ARGS[@]}"
              ;;
            api)
              yarn publish:api "${VERSION_ARGS[@]}"
              ;;
            discord)
              yarn publish:discord "${VERSION_ARGS[@]}"
              ;;
            *)
              echo "Unknown changelog_target"; exit 1
              ;;
          esac

  publish_renderer:
    name: Publish Remote Renderer
    needs: build
    if: ${{ inputs.publish_renderer == true }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    concurrency:
      group: remote-renderer-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        if: ${{ inputs.upload_to_glitchtip == true }}
        run: yarn -s sentry-cli --version

      - name: Publish remote renderer
        run: yarn renderer:publish
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}
          GLITCHTIP_SOURCEMAPS: ${{ inputs.upload_to_glitchtip && '1' || '0' }}
          GLITCHTIP_SOURCEMAPS_UPLOAD: ${{ inputs.upload_to_glitchtip && '1' || '0' }}
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Build GitHub Pages renderer
        run: yarn renderer:build --cdn-url https://pulsesync-llc.github.io/PulseSync-renderer/app --out-dir out/github-pages-build/app
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}
          GLITCHTIP_SOURCEMAPS: "0"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "0"

      - name: Checkout renderer Pages repository
        uses: actions/checkout@v6
        with:
          repository: PulseSync-LLC/PulseSync-renderer
          token: ${{ secrets.RENDERER_REPO_TOKEN }}
          ref: gh-pages
          path: out/github-pages-repository

      - name: Stage GitHub Pages renderer
        run: yarn renderer:stage-pages --source out/github-pages-build --target out/github-pages-repository

      - name: Publish GitHub Pages renderer
        shell: bash
        working-directory: out/github-pages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Pages renderer is already current."
            exit 0
          fi
          expected_head="$(git rev-parse HEAD)"
          git checkout --orphan pages-publish
          git add --all
          git commit -m "chore: publish renderer $GITHUB_RUN_ID"
          git push --force-with-lease="gh-pages:$expected_head" origin HEAD:gh-pages
