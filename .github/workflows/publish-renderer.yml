name: Publish Remote Renderer

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      build_number:
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    concurrency:
      group: remote-renderer-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Typecheck renderer
        run: yarn typecheck

      - name: Lint renderer
        run: yarn lint

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Publish remote renderer
        id: renderer_publish
        run: yarn renderer:publish --channel ${{ inputs.channel }}
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ inputs.build_number || github.run_id }}
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Checkout renderer Pages repository
        uses: actions/checkout@v7
        with:
          repository: PulseSync-LLC/PulseSync-renderer
          token: ${{ secrets.RENDERER_REPO_TOKEN }}
          ref: gh-pages
          path: out/github-pages-repository

      - name: Stage GitHub Pages renderer
        run: yarn renderer:stage-pages --channel ${{ inputs.channel }} --source out/remote-renderer --target out/github-pages-repository

      - name: Publish GitHub Pages renderer
        shell: bash
        working-directory: out/github-pages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Pages renderer is already current."
            exit 0
          fi
          expected_head="$(git rev-parse HEAD)"
          git checkout --orphan pages-publish
          git add --all
          git commit -m "chore: publish renderer $GITHUB_RUN_ID"
          git push --force-with-lease="gh-pages:$expected_head" origin HEAD:gh-pages

      - name: Verify published renderer endpoints
        run: |
          yarn tsx scripts/renderer/remote-renderer.ts verify --channel ${{ inputs.channel }}
          yarn tsx scripts/renderer/remote-renderer.ts verify --channel ${{ inputs.channel }} --cdn-url https://static.pulsesync.dev/app/${{ inputs.channel }}
