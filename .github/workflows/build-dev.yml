name: Build Application (Dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            desktop:
              - 'src/bootstrap.ts'
              - 'src/index.ts'
              - 'src/main/**'
              - 'src/common/**'
              - 'src/renderer/preloader.html'
              - 'src/styles/fonts.css'
              - 'src/styles/globals.css'
              - 'src/styles/preloader.css'
              - 'static/**'
              - 'icons/**'
              - 'nativeModules/**'
              - 'packages/bootstrapper/**'
              - 'packages/desktop-core/**'
              - 'scripts/**'
              - '!scripts/renderer/**'
              - 'scriptsInstaller/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'forge.config.ts'
              - 'vite.main.config.ts'
              - 'vite.preload.config.ts'
              - 'vite.renderer.config.ts'
              - 'vite.worker.config.ts'
              - 'electron-builder.yml'
              - 'tsconfig*.json'
              - 'Info.plist'
              - 'graphql.config.yml'
              - 'schema.graphql'
              - '.github/workflows/build-dev.yml'
            renderer:
              - 'src/renderer/**'
              - 'src/common/**'
              - 'src/main/renderer.ts'
              - 'src/locales/**'
              - 'src/styles/**'
              - 'static/**'
              - 'scripts/renderer/**'
              - 'scripts/s3-upload.ts'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'vite.renderer.config.ts'
              - 'vite-env.d.ts'
              - 'tsconfig*.json'
              - '.github/workflows/build-dev.yml'

      - name: Report changed build-related files
        shell: bash
        run: |
          echo "desktop=${{ steps.filter.outputs.desktop }}"
          echo "renderer=${{ steps.filter.outputs.renderer }}"

  version:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Compute dev version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./packages/desktop-core/package.json').version.split('-')[0]")"
          DEV_VERSION="$(yarn -s tsx scripts/resolve-dev-version.ts --base-version "$BASE_VERSION")"
          echo "build_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using BUILD_VERSION=$DEV_VERSION"

  build:
    needs: [changes, version]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26, macos-26-intel]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - uses: actions/cache@v5
        with:
          path: |
            nativeModules/**/node_modules
            nativeModules/**/build
            nativeModules/**/target
            packages/bootstrapper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-node22-rust188-${{ hashFiles('nativeModules/**/package.json', 'nativeModules/**/Cargo.toml', 'nativeModules/**/Cargo.lock', 'nativeModules/**/build.rs', 'nativeModules/**/*.rs', 'packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/src/**/*.rs') }}

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build and publish dev
        run: yarn build:package --nativeModules ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }} --publish dev
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PULSESYNC_MAC_SIGN_IDENTITY: "-"
          S3_KEEP_RECENT_VERSIONS: 3
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout ${{ startsWith(matrix.os, 'macos-') && runner.arch == 'X64' && '--mac-x64' || '' }}

      - name: Verify macOS atomic bundle update
        if: startsWith(matrix.os, 'macos-')
        run: yarn bootstrapper:verify-macos-update

      - name: Verify macOS external recovery across helper crashes
        if: startsWith(matrix.os, 'macos-') && runner.arch == 'ARM64'
        run: |
          yarn bootstrapper:verify-macos-update --with-launch-agent --kill-helper-after-exchange
          yarn bootstrapper:verify-macos-update --with-launch-agent --kill-helper-after-ack

      - name: Show release contents
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Upload release artifacts for GitHub prerelease
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

  publish_renderer:
    name: Publish Remote Renderer
    needs: changes
    if: ${{ needs.changes.outputs.renderer == 'true' }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Publish remote renderer
        run: yarn renderer:publish
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}

  github_prerelease:
    name: Create GitHub Prerelease
    needs: [changes, version, build]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: github-release-artifacts

      - name: Prepare GitHub release assets
        shell: bash
        run: |
          mkdir -p github-release-assets
          declare -A NAME_COUNT=()

          while IFS= read -r -d '' file; do
            base_name="$(basename "$file")"
            artifact_dir="$(printf '%s' "$file" | sed -E 's#^github-release-artifacts/([^/]+)/.*#\1#')"
            target_name="$base_name"
            name_count="${NAME_COUNT[$base_name]:-0}"

            if (( name_count > 0 )); then
              target_name="${artifact_dir}-${name_count}-${base_name}"
            fi

            NAME_COUNT["$base_name"]=$((name_count + 1))
            cp "$file" "github-release-assets/$target_name"
          done < <(find github-release-artifacts -type f -print0 | sort -z)

          find github-release-assets -maxdepth 1 -type f | sort

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.version.outputs.build_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.build_version }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  skip-build:
    needs: changes
    if: ${{ needs.changes.outputs.desktop != 'true' && needs.changes.outputs.renderer != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip dev build
        run: echo "Skipping dev workflow because no desktop or renderer files changed."
