name: Build Application (Dev)

on:
  push:
    branches:
      - dev

permissions:
  actions: read
  contents: write

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bootstrapper: ${{ steps.filter.outputs.bootstrapper }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.common.outputs.desktop == 'true' || ((steps.filter.outputs.desktop_core == 'true' || steps.common.outputs.desktop_core == 'true') && steps.filter.outputs.bootstrapper == 'true') }}
      desktop_core: ${{ steps.filter.outputs.desktop_core == 'true' || steps.common.outputs.desktop_core == 'true' }}
      renderer: ${{ steps.filter.outputs.renderer == 'true' || steps.common.outputs.renderer == 'true' }}
      retention: ${{ steps.filter.outputs.retention }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.ref_name }}
          list-files: json
          filters: |
            desktop:
              - 'src/main/!(core)/**'
              - 'src/main/core/mod/network/artifactWorker*'
              - 'src/main/core/nativeModules/pulsesyncNative.ts'
              - 'src/main/core/bootstrap/activeComponents.ts'
              - 'src/preload/!(mainWindowPreload.ts)/**'
              - 'src/locales/bundled/*/main.json'
              - 'src/renderer/preloader.html'
              - 'src/renderer/preloader.ts'
              - 'src/styles/fonts.css'
              - 'src/styles/globals.css'
              - 'src/styles/preloader.css'
              - 'static/assets/icon/**'
              - 'icons/**'
              - 'nativeModules/**'
              - 'packages/desktop-core/**'
              - 'scripts/!(@(s3-prune.ts|s3-retention.ts|s3-upload.ts))'
              - 'scripts/!(@(bootstrapper|renderer))/**/*'
              - 'scripts/bootstrapper/verify-*.ts'
              - 'scripts/bootstrapper/fixtures/**'
              - 'scripts/resolve-dev-version.ts'
              - 'scripts/s3-upload.ts'
              - 'scriptsInstaller/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'forge.config.ts'
              - 'vite.main.config.ts'
              - 'vite.preload.config.ts'
              - 'vite.renderer.config.ts'
              - 'vite.worker.config.ts'
              - 'electron-builder.yml'
              - 'tsconfig*.json'
              - 'Info.plist'
              - 'graphql.config.yml'
              - 'schema.graphql'
              - '.github/actions/cache-build-deps/**'
              - '.github/workflows/build-dev.yml'
              - '.github/workflows/desktop-tests.yml'
            desktop_core:
              - 'src/main/core/**'
              - 'src/preload/mainWindowPreload.ts'
            common:
              - 'src/common/**'
            bootstrapper:
              - 'packages/bootstrapper/**'
              - 'scripts/bootstrapper/**'
            renderer:
              - 'src/renderer/**'
              - 'src/locales/**'
              - 'src/styles/**'
              - 'static/**'
              - 'scripts/renderer/**'
              - '.github/workflows/publish-renderer.yml'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'vite.renderer.config.ts'
              - 'vite-env.d.ts'
              - 'tsconfig*.json'
            retention:
              - 'scripts/s3-prune.ts'
              - 'scripts/s3-retention.ts'
              - '.github/workflows/desktop-s3-cleanup.yml'
              - '.github/workflows/build-dev.yml'
              - '.github/workflows/build-manual.yml'
              - '.github/workflows/publish-component.yml'

      - uses: actions/setup-node@v7
        if: ${{ steps.filter.outputs.common == 'true' }}
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Install common routing dependencies
        if: ${{ steps.filter.outputs.common == 'true' }}
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Classify common changes
        if: ${{ steps.filter.outputs.common == 'true' }}
        id: common
        env:
          COMMON_FILES: ${{ steps.filter.outputs.common_files }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/classify-common-changes.mjs

      - name: Report changed build-related files
        shell: bash
        run: |
          echo "bootstrapper=${{ steps.filter.outputs.bootstrapper }}"
          echo "desktop_filter=${{ steps.filter.outputs.desktop }}"
          echo "desktop_core=${{ steps.filter.outputs.desktop_core }}"
          echo "renderer=${{ steps.filter.outputs.renderer }}"
          echo "retention=${{ steps.filter.outputs.retention }}"

  version:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_core == 'true' }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Compute dev version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./packages/desktop-core/package.json').version.split('-')[0]")"
          DEV_VERSION="$(yarn -s tsx scripts/resolve-dev-version.ts --base-version "$BASE_VERSION" --repository "$GITHUB_REPOSITORY")"
          echo "build_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using BUILD_VERSION=$DEV_VERSION"

  tests:
    name: Test Desktop
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_core == 'true' }}
    uses: ./.github/workflows/desktop-tests.yml
    with:
      checkout_ref: ${{ github.sha }}

  build:
    needs: [changes, version, tests]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build dev release
        run: yarn build:package --nativeModules --publish dev
        env:
          PULSESYNC_WINDOWS_PFX_BASE64: ${{ secrets.PULSESYNC_WINDOWS_PFX_BASE64 }}
          PULSESYNC_WINDOWS_PFX_PASSWORD: ${{ secrets.PULSESYNC_WINDOWS_PFX_PASSWORD }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PULSESYNC_DEFER_S3_PUBLISH: "1"
          PULSESYNC_AUTO_COMPONENT_REVISIONS: "1"
          PULSESYNC_DISABLE_FILE_INVENTORIES: "0"
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Stage release output
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

  publish_desktop_core:
    name: Publish Desktop Core Component
    needs: [changes, version, tests]
    if: >-
      ${{
        needs.changes.result == 'success' &&
        needs.version.result == 'success' &&
        needs.tests.result == 'success' &&
        needs.changes.outputs.desktop_core == 'true' &&
        needs.changes.outputs.desktop != 'true'
      }}
    uses: ./.github/workflows/publish-component.yml
    with:
      ref: ${{ github.sha }}
      channel: dev
      component: desktopCore
      build_os: all
      build_version: ${{ needs.version.outputs.build_version }}
    secrets: inherit

  publish_bootstrapper:
    name: Publish Bootstrapper Component
    needs: changes
    if: ${{ needs.changes.outputs.bootstrapper == 'true' && needs.changes.outputs.desktop != 'true' }}
    uses: ./.github/workflows/publish-component.yml
    with:
      ref: ${{ github.sha }}
      channel: dev
      component: bootstrapper
      build_os: all
      release_mode: reuse-latest
    secrets: inherit

  cleanup_desktop_s3:
    name: Cleanup Desktop S3
    needs: [changes, build, publish_desktop_core, publish_renderer, github_prerelease]
    if: >-
      ${{
        always() &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.retention == 'true') &&
        (needs.changes.outputs.desktop_core != 'true' || needs.changes.outputs.desktop == 'true') &&
        (needs.changes.outputs.bootstrapper != 'true' || needs.changes.outputs.desktop == 'true')
      }}
    uses: ./.github/workflows/desktop-s3-cleanup.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  publish_renderer:
    name: Publish Remote Renderer
    needs: [changes, github_prerelease, publish_desktop_core, publish_bootstrapper]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        (needs.changes.outputs.renderer == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_core == 'true' || needs.changes.outputs.bootstrapper == 'true') &&
        (needs.changes.outputs.desktop != 'true' || needs.github_prerelease.result == 'success') &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_core != 'true' || needs.publish_desktop_core.result == 'success') &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.bootstrapper != 'true' || needs.publish_bootstrapper.result == 'success')
      }}
    uses: ./.github/workflows/publish-renderer.yml
    with:
      channel: dev
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  github_prerelease:
    name: Publish Desktop Prerelease
    concurrency:
      group: desktop-manifest-publish-dev
      cancel-in-progress: false
    needs: [changes, version, build]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: staged-release
          merge-multiple: true

      - name: Validate complete staged release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.build_version }}
          EXPECTED_METADATA_VERSION: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const expected = [
              ['desktop-update-hybrid-darwin-universal.json', 'darwin-universal'],
              ['desktop-update-linux-x64.json', 'linux-x64'],
              ['desktop-update-win32-x64.json', 'win32-x64'],
          ]

          for (const [name, dist] of expected) {
              const file = path.join('staged-release', name)
              if (!fs.existsSync(file)) throw new Error(`Missing staged manifest: ${name}`)
              const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
              if (String(manifest.metadataVersion) !== process.env.EXPECTED_METADATA_VERSION) {
                  throw new Error(`${name} metadataVersion mismatch: ${manifest.metadataVersion}`)
              }
              if (manifest.desktopVersion !== process.env.EXPECTED_VERSION) {
                  throw new Error(`${name} desktopVersion mismatch: ${manifest.desktopVersion}`)
              }
              if (manifest.channel !== 'dev') throw new Error(`${name} channel mismatch: ${manifest.channel}`)
              if (!manifest.targets?.[dist]) throw new Error(`${name} has no target for ${dist}`)
          }
          NODE

      - name: Prepare GitHub release assets
        run: >-
          yarn tsx scripts/github-release-runtime.ts prepare
          --source staged-release
          --target github-release-assets
          --repository ${{ github.repository }}
          --tag ${{ needs.version.outputs.build_version }}

      - name: Publish complete S3 release
        run: >-
          yarn tsx scripts/s3-upload.ts
          --branch dev
          --dir staged-release
          --version ${{ needs.version.outputs.build_version }}
          --legacy-update-bridge

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.build_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.build_version }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  skip-build:
    needs: changes
    if: ${{ needs.changes.outputs.bootstrapper != 'true' && needs.changes.outputs.desktop != 'true' && needs.changes.outputs.desktop_core != 'true' && needs.changes.outputs.renderer != 'true' && needs.changes.outputs.retention != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip dev build
        run: echo "Skipping dev workflow because no desktop, renderer, or retention files changed."
