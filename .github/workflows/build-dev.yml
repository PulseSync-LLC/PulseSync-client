name: Build Application (Dev)

on:
  push:
    branches:
      - dev

permissions:
  actions: read
  contents: write

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      bootstrapper: ${{ steps.filter.outputs.bootstrapper }}
      desktop: ${{ steps.filter.outputs.desktop }}
      renderer: ${{ steps.filter.outputs.renderer }}
      retention: ${{ steps.filter.outputs.retention }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            desktop:
              - 'src/bootstrap.ts'
              - 'src/index.ts'
              - 'src/main/**'
              - 'src/common/**'
              - 'src/renderer/preloader.html'
              - 'src/styles/fonts.css'
              - 'src/styles/globals.css'
              - 'src/styles/preloader.css'
              - 'static/**'
              - 'icons/**'
              - 'nativeModules/**'
              - 'packages/desktop-core/**'
              - 'scripts/!(@(s3-prune.ts|s3-retention.ts|s3-upload.ts))'
              - 'scripts/!(@(bootstrapper|renderer))/**/*'
              - 'scripts/s3-upload.ts'
              - 'scriptsInstaller/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'forge.config.ts'
              - 'vite.main.config.ts'
              - 'vite.preload.config.ts'
              - 'vite.renderer.config.ts'
              - 'vite.worker.config.ts'
              - 'electron-builder.yml'
              - 'tsconfig*.json'
              - 'Info.plist'
              - 'graphql.config.yml'
              - 'schema.graphql'
              - '.github/actions/cache-build-deps/**'
              - '.github/workflows/build-dev.yml'
              - '.github/workflows/desktop-tests.yml'
            bootstrapper:
              - 'packages/bootstrapper/**'
              - 'scripts/bootstrapper/**'
            renderer:
              - 'src/renderer/**'
              - 'src/common/**'
              - 'src/main/renderer.ts'
              - 'src/locales/**'
              - 'src/styles/**'
              - 'static/**'
              - 'scripts/renderer/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'vite.renderer.config.ts'
              - 'vite-env.d.ts'
              - 'tsconfig*.json'
            retention:
              - 'scripts/s3-prune.ts'
              - 'scripts/s3-retention.ts'
              - '.github/workflows/desktop-s3-cleanup.yml'
              - '.github/workflows/build-dev.yml'
              - '.github/workflows/build-manual.yml'
              - '.github/workflows/publish-component.yml'

      - name: Report changed build-related files
        shell: bash
        run: |
          echo "bootstrapper=${{ steps.filter.outputs.bootstrapper }}"
          echo "desktop=${{ steps.filter.outputs.desktop }}"
          echo "renderer=${{ steps.filter.outputs.renderer }}"
          echo "retention=${{ steps.filter.outputs.retention }}"

  version:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: BUILD_PRODUCTION
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Compute dev version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./packages/desktop-core/package.json').version.split('-')[0]")"
          DEV_VERSION="$(yarn -s tsx scripts/resolve-dev-version.ts --base-version "$BASE_VERSION")"
          echo "build_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using BUILD_VERSION=$DEV_VERSION"

  tests:
    name: Test Desktop
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    uses: ./.github/workflows/desktop-tests.yml
    with:
      checkout_ref: ${{ github.sha }}

  build:
    needs: [changes, version, tests]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-26]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Build dev release
        run: yarn build:package --nativeModules --publish dev
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          PULSESYNC_DEFER_S3_PUBLISH: "1"
          PULSESYNC_AUTO_COMPONENT_REVISIONS: "1"
          PULSESYNC_DISABLE_FILE_INVENTORIES: "1"
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

      - name: Stage release output
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          if-no-files-found: error

  publish_bootstrapper:
    name: Publish Bootstrapper Component
    needs: changes
    if: ${{ needs.changes.outputs.bootstrapper == 'true' && needs.changes.outputs.desktop != 'true' }}
    uses: ./.github/workflows/publish-component.yml
    with:
      ref: ${{ github.sha }}
      channel: dev
      component: bootstrapper
      build_os: all
      release_mode: reuse-latest
    secrets: inherit

  cleanup_desktop_s3:
    name: Cleanup Desktop S3
    needs: [changes, build, publish_renderer, github_prerelease]
    if: >-
      ${{
        always() &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.retention == 'true') &&
        (needs.changes.outputs.bootstrapper != 'true' || needs.changes.outputs.desktop == 'true')
      }}
    uses: ./.github/workflows/desktop-s3-cleanup.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  publish_renderer:
    name: Publish Remote Renderer
    needs: [changes, github_prerelease]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.renderer == 'true' &&
        (needs.changes.outputs.desktop != 'true' || needs.github_prerelease.result == 'success')
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: BUILD_PRODUCTION
    concurrency:
      group: remote-renderer-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check Sentry CLI
        run: yarn -s sentry-cli --version

      - name: Publish remote renderer
        id: renderer_publish
        run: yarn renderer:publish --channel dev
        env:
          PULSESYNC_REMOTE_RENDERER_BUILD_NUMBER: ${{ github.run_id }}
          GLITCHTIP_SOURCEMAPS: "1"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "1"
          SENTRY_URL: https://issues.pulsesync.dev
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
          SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}

      - name: Checkout renderer Pages repository
        if: ${{ steps.renderer_publish.outputs.changed == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: PulseSync-LLC/PulseSync-renderer
          token: ${{ secrets.RENDERER_REPO_TOKEN }}
          ref: gh-pages
          path: out/github-pages-repository

      - name: Stage GitHub Pages renderer
        if: ${{ steps.renderer_publish.outputs.changed == 'true' }}
        run: yarn renderer:stage-pages --channel dev --source out/remote-renderer --target out/github-pages-repository

      - name: Publish GitHub Pages renderer
        if: ${{ steps.renderer_publish.outputs.changed == 'true' }}
        shell: bash
        working-directory: out/github-pages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Pages renderer is already current."
            exit 0
          fi
          expected_head="$(git rev-parse HEAD)"
          git checkout --orphan pages-publish
          git add --all
          git commit -m "chore: publish renderer $GITHUB_RUN_ID"
          git push --force-with-lease="gh-pages:$expected_head" origin HEAD:gh-pages

  github_prerelease:
    name: Publish Desktop Prerelease
    needs: [changes, version, build]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: BUILD_PRODUCTION

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Create .env
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: staged-release
          merge-multiple: true

      - name: Validate complete staged release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.build_version }}
          EXPECTED_METADATA_VERSION: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const expected = [
              ['desktop-update-hybrid-darwin-universal.json', 'darwin-universal'],
              ['desktop-update-linux-x64.json', 'linux-x64'],
              ['desktop-update-win32-x64.json', 'win32-x64'],
          ]

          for (const [name, dist] of expected) {
              const file = path.join('staged-release', name)
              if (!fs.existsSync(file)) throw new Error(`Missing staged manifest: ${name}`)
              const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
              if (String(manifest.metadataVersion) !== process.env.EXPECTED_METADATA_VERSION) {
                  throw new Error(`${name} metadataVersion mismatch: ${manifest.metadataVersion}`)
              }
              if (manifest.desktopVersion !== process.env.EXPECTED_VERSION) {
                  throw new Error(`${name} desktopVersion mismatch: ${manifest.desktopVersion}`)
              }
              if (manifest.channel !== 'dev') throw new Error(`${name} channel mismatch: ${manifest.channel}`)
              if (!manifest.targets?.[dist]) throw new Error(`${name} has no target for ${dist}`)
          }
          NODE

      - name: Prepare GitHub release assets
        run: >-
          node scripts/github-release-runtime.mjs prepare
          --source staged-release
          --target github-release-assets
          --repository ${{ github.repository }}
          --tag ${{ needs.version.outputs.build_version }}

      - name: Publish complete S3 release
        run: >-
          yarn tsx scripts/s3-upload.ts
          --branch dev
          --dir staged-release
          --version ${{ needs.version.outputs.build_version }}
          --legacy-update-bridge

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.version.outputs.build_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.build_version }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            github-release-assets/*

  skip-build:
    needs: changes
    if: ${{ needs.changes.outputs.bootstrapper != 'true' && needs.changes.outputs.desktop != 'true' && needs.changes.outputs.renderer != 'true' && needs.changes.outputs.retention != 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Skip dev build
        run: echo "Skipping dev workflow because no desktop, renderer, or retention files changed."
