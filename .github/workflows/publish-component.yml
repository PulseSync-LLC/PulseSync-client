name: Publish Runtime Component

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        type: string
      component:
        description: "Runtime component"
        required: true
        type: string
      build_os:
        description: "Platforms to publish"
        required: true
        type: string
      build_version:
        description: "Resolved desktop core version"
        required: false
        default: ""
        type: string
      release_mode:
        description: "Create an ordinary release or update the latest dev release"
        required: false
        default: new
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish"
        required: true
        default: "dev"
      channel:
        description: "Update channel"
        required: true
        type: choice
        options:
          - dev
          - beta
        default: dev
      component:
        description: "Runtime component"
        required: true
        type: choice
        options:
          - desktopCore
          - artifactWorker
          - pulsesyncNative
          - bootstrapper
        default: desktopCore
      build_os:
        description: "Platforms to publish"
        required: true
        type: choice
        options:
          - all
          - windows-2025
          - ubuntu-latest
          - macos-26
        default: all
      release_mode:
        description: "Release target"
        required: true
        type: choice
        options:
          - new
          - reuse-latest
        default: new

permissions:
  actions: read
  contents: write

concurrency:
  group: runtime-component-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare component release
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      build_version: ${{ steps.release.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Create environment
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Rust for bootstrapper validation
        if: ${{ inputs.component == 'bootstrapper' }}
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.88.0

      - name: Validate bootstrapper
        if: ${{ inputs.component == 'bootstrapper' }}
        run: |
          cargo fmt --manifest-path packages/bootstrapper/Cargo.toml --check
          cargo check --manifest-path packages/bootstrapper/Cargo.toml
          cargo test --manifest-path packages/bootstrapper/Cargo.toml

      - id: release
        name: Resolve release matrix and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.build_version }}
          CHANNEL: ${{ inputs.channel }}
          BUILD_OS: ${{ inputs.build_os }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          COMPONENT: ${{ inputs.component }}
        run: yarn tsx scripts/component-release.ts resolve

  build:
    name: Build ${{ inputs.component }} (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create environment
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Build component and prepare GitHub assets
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          PULSESYNC_WINDOWS_PFX_BASE64: ${{ secrets.PULSESYNC_WINDOWS_PFX_BASE64 }}
          PULSESYNC_WINDOWS_PFX_PASSWORD: ${{ secrets.PULSESYNC_WINDOWS_PFX_PASSWORD }}
          DESKTOP_METADATA_VERSION: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GLITCHTIP_SOURCEMAPS: "0"
          GLITCHTIP_SOURCEMAPS_UPLOAD: "0"
          PULSESYNC_DEFER_S3_PUBLISH: "1"
          PULSESYNC_DISABLE_FILE_INVENTORIES: "0"
        run: >-
          yarn component:publish
          --component ${{ inputs.component }}
          --channel ${{ inputs.channel }}
          --repository ${{ github.repository }}
          --github-tag ${{ needs.prepare.outputs.tag }}
          ${{ inputs.release_mode == 'reuse-latest' && '--reuse-latest' || '' }}

      - name: Upload prepared GitHub assets
        uses: actions/upload-artifact@v7
        with:
          name: component-release-${{ runner.os }}-${{ runner.arch }}
          path: out/component-github-release/**/*
          if-no-files-found: error

      - name: Upload staged S3 assets
        uses: actions/upload-artifact@v7
        with:
          name: component-s3-${{ runner.os }}-${{ runner.arch }}
          path: out/component-s3-release/**/*
          if-no-files-found: error

  cleanup_desktop_s3:
    name: Cleanup Desktop S3
    needs: [build, release]
    if: >-
      ${{
        always() &&
        (inputs.channel == 'dev' || inputs.channel == 'beta') &&
        needs.release.result == 'success'
      }}
    uses: ./.github/workflows/desktop-s3-cleanup.yml
    with:
      checkout_ref: ${{ inputs.ref }}
    secrets: inherit

  release:
    name: Publish component GitHub assets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: BUILD_PRODUCTION
    concurrency:
      group: desktop-manifest-publish-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Checkout component release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Create environment
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download prepared assets
        uses: actions/download-artifact@v8
        with:
          pattern: component-release-*
          path: component-release-assets
          merge-multiple: true

      - name: Download staged S3 assets
        uses: actions/download-artifact@v8
        with:
          pattern: component-s3-*
          path: component-s3-assets
          merge-multiple: true

      - id: s3_release
        name: Validate complete staged release
        shell: bash
        env:
          BUILD_MATRIX: ${{ needs.prepare.outputs.matrix }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          METADATA_VERSION: ${{ github.run_id }}
          CHANNEL: ${{ inputs.channel }}
          COMPONENT: ${{ inputs.component }}
        run: yarn tsx scripts/component-release.ts validate

      - name: Show release assets
        shell: bash
        run: find component-release-assets -type f | sort

      - name: Download current release manifests
        if: ${{ inputs.release_mode == 'reuse-latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'desktop-update-*.json' \
            --dir current-release-manifests

      - name: Rebase component manifests onto current release
        if: ${{ inputs.release_mode == 'reuse-latest' }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          COMPONENT: ${{ inputs.component }}
        run: yarn tsx scripts/component-release.ts rebase

      - name: Update existing GitHub release
        if: ${{ inputs.release_mode == 'reuse-latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find component-release-assets -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release view "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

      - name: Create ordinary GitHub release draft
        if: ${{ inputs.release_mode != 'reuse-latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          mapfile -d '' assets < <(find component-release-assets -type f -print0)
          yarn tsx scripts/component-release.ts check-new
          options=(--draft --title "$TAG" --notes "" --latest=false --target "$RELEASE_REF")
          if [[ "$PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${options[@]}" "${assets[@]}"

      - name: Publish complete S3 release
        run: >-
          yarn tsx scripts/s3-upload.ts
          --branch ${{ inputs.channel }}
          --dir component-s3-publish
          --version ${{ steps.s3_release.outputs.version }}

      - name: Publish ordinary GitHub release
        if: ${{ inputs.release_mode != 'reuse-latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

      - name: Report incomplete publication
        if: ${{ failure() }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Publication of $TAG failed. Inspect the GitHub release/draft and S3 manifests before retrying; either destination may be partially updated." >> "$GITHUB_STEP_SUMMARY"
