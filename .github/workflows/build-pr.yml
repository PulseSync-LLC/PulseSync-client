name: Build Application (PR)

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  tests:
    name: Test Desktop
    uses: ./.github/workflows/desktop-tests.yml

  build:
    needs: tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.os }}
    environment: BUILD_PRODUCTION
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-26]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi

      - uses: ./.github/actions/cache-build-deps

      - name: Create .env
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build (package)
        run: yarn build:package --nativeModules

      - name: Verify bootstrapper layout
        run: yarn bootstrapper:verify-build-layout

      - name: Show release contents (debug)
        shell: bash
        run: |
          if [ -d release ]; then
            echo "release/ files:"
            find release -maxdepth 2 -type f | sort
          else
            echo "release/ not found"; exit 1
          fi

  renderer:
    name: Build Remote Renderer
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build remote renderer
        run: yarn renderer:build --channel dev --build-number "${{ github.run_id }}" --out-dir out/remote-renderer-pr

      - name: Verify remote renderer contract
        shell: bash
        env:
          EXPECTED_BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          actual_build_number="$(node -p "require('./out/remote-renderer-pr/desktop/manifest.json').buildNumber")"
          test "$actual_build_number" = "$EXPECTED_BUILD_NUMBER"
          test -f "out/remote-renderer-pr/versions/$EXPECTED_BUILD_NUMBER/index.html"
          if find out/remote-renderer-pr -type f -name '*.map' -print -quit | grep -q .; then
            echo "Production remote renderer contains source maps"
            exit 1
          fi
