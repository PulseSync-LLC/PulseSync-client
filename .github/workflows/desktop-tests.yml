name: Desktop Tests

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to test"
        required: false
        type: string
        default: ""
      use_blacksmith:
        description: "Run checks on Blacksmith runners"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  common:
    name: Common checks
    runs-on: ${{ inputs.use_blacksmith && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --no-self-update
          rustup default 1.99.1

      - uses: actions/cache@v6
        with:
          path: |
            packages/bootstrapper/target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-tests-${{ runner.os }}-${{ runner.arch }}-node24-rust1991-${{ hashFiles('yarn.lock', 'packages/bootstrapper/Cargo.toml', 'packages/bootstrapper/Cargo.lock', 'packages/bootstrapper/src/**/*.rs') }}

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Typecheck desktop
        run: yarn typecheck

      - name: Lint desktop
        run: yarn lint

      - name: Check bootstrapper formatting
        run: cargo fmt --manifest-path packages/bootstrapper/Cargo.toml --check

      - name: Check bootstrapper
        run: cargo check --manifest-path packages/bootstrapper/Cargo.toml

      - name: Test bootstrapper
        run: cargo test --manifest-path packages/bootstrapper/Cargo.toml

      - name: Verify launch routing
        run: yarn bootstrapper:verify-launch-routing

      - name: Verify release routing
        run: yarn bootstrapper:verify-release-routing
